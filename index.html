<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ГДЗ: Супер-Решатель</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6b7be8 0%, #9b6cc2 55%, #c56ca8 100%);
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 560px;
      border-radius: 28px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
      text-align: center;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      color: #e64965;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    .subtitle b {
      color: #374151;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
    }

    .btn-solve {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(90deg, #ff516b 0%, #ff7b54 100%);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 20px rgba(255, 81, 107, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }

    .btn-solve:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(255, 81, 107, 0.45);
    }

    .btn-solve:active {
      transform: translateY(0);
    }

    .examples {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: #6b7280;
    }

    .chip {
      background: #eef2ff;
      color: #4f46e5;
      border: none;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .chip:hover {
      background: #e0e7ff;
      transform: scale(1.04);
    }

    .result-box {
      display: none;
      margin-top: 24px;
      text-align: left;
      background: #f9fafb;
      border: 2px solid #f3f4f6;
      border-radius: 18px;
      padding: 20px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .step {
      margin-bottom: 12px;
      font-size: 15px;
      color: #374151;
      line-height: 1.5;
    }

    .step-badge {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      font-weight: 700;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 6px;
      margin-right: 6px;
    }

    .final-answer {
      margin-top: 14px;
      padding: 12px 16px;
      background: #ecfdf5;
      border-left: 4px solid #10b981;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 800;
      color: #065f46;
    }

    .error {
      background: #fef2f2;
      border-left: 4px solid #ef4444;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
    }

      @media (max-width: 480px) {
      .input-group { flex-direction: column; }
      .btn-solve { justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">🧩 ГДЗ: Супер-Решатель</div>
    <p class="subtitle">Введи уравнение с переменной <b>x</b> и получи яркий разбор</p>

    <div class="input-group">
      <input type="text" id="eqInput" value="2x + 5 = 15" placeholder="Например: 2x + 5 = 15" />
      <button class="btn-solve" onclick="solveEquation()">Решить 🚀</button>
    </div>

    <div class="examples">
      <span>Примеры:</span>
      <button class="chip" onclick="setExample('3x - 7 = 14')">3x - 7 = 14</button>
      <button class="chip" onclick="setExample('5x + 2 = 3x + 10')">5x + 2 = 3x + 10</button>
      <button class="chip" onclick="setExample('-2x + 8 = 0')">-2x + 8 = 0</button>
    </div>

    <div class="result-box" id="resultBox"></div>
  </div>

  <script>
    const input = document.getElementById('eqInput');
    const resultBox = document.getElementById('resultBox');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') solveEquation();
    });

    function setExample(eq) {
      input.value = eq;
      solveEquation();
    }

    function parseSide(expr) {
      // Убираем пробелы, заменяем кириллическую 'х' и заглавную 'X' на 'x', запятые на точки
      let clean = expr
        .replace(/\s+/g, '')
        .replace(/[хХX]/g, 'x')
        .replace(/,/g, '.');

      if (!clean) throw new Error('Пустая часть уравнения');

      // Разбиваем на слагаемые по знакам + и -
      const terms = clean.match(/[+-]?[^+-]+/g);
      if (!terms) throw new Error('Не удалось разобрать выражение');

      let a = 0; // коэффициент при x
      let b = 0; // свободный член

      for (let term of terms) {
        if (term.includes('x')) {
          if (!/^[+-]?\d*(\.\d+)?x$/.test(term)) {
            throw new Error(`Неподдерживаемый элемент: "${term}"`);
          }
          let coeff = term.replace('x', '');
          if (coeff === '' || coeff === '+') a += 1;
          else if (coeff === '-') a -= 1;
          else a += parseFloat(coeff);
        } else {
          if (!/^[+-]?\d+(\.\d+)?$/.test(term)) {
            throw new Error(`Некорректное число: "${term}"`);
          }
          b += parseFloat(term);
        }
      }
      return { a, b };
    }

    function formatNum(n) {
      return Number.isInteger(n) ? n : parseFloat(n.toFixed(4));
    }

    function solveEquation() {
      const raw = input.value.trim();
      resultBox.style.display = 'block';

      try {
        const parts = raw.split('=');
        if (parts.length !== 2) {
          throw new Error('В уравнении должен быть ровно один знак "="');
        }

        const left = parseSide(parts[0]);
        const right = parseSide(parts[1]);

        const totalA = formatNum(left.a - right.a);
        const totalB = formatNum(right.b - left.b);

        let stepsHTML = `
          <div class="step">
            <span class="step-badge">Шаг 1</span>
            Приводим подобные слагаемые в обеих частях:
            <b>${formatNum(left.a)}x ${left.b >= 0 ? '+ ' + formatNum(left.b) : '- ' + Math.abs(formatNum(left.b))} = ${formatNum(right.a)}x ${right.b >= 0 ? '+ ' + formatNum(right.b) : '- ' + Math.abs(formatNum(right.b))}</b>
          </div>
          <div class="step">
            <span class="step-badge">Шаг 2</span>
            Переносим всё с <b>x</b> влево, а числа — вправо (меняя знаки на противоположные):
            <b>${formatNum(left.a)}x ${right.a >= 0 ? '- ' + formatNum(right.a) : '+ ' + Math.abs(formatNum(right.a))}x = ${formatNum(right.b)} ${left.b >= 0 ? '- ' + formatNum(left.b) : '+ ' + Math.abs(formatNum(left.b))}</b>
          </div>
          <div class="step">
            <span class="step-badge">Шаг 3</span>
            Упрощаем: <b>${totalA}x = ${totalB}</b>
          </div>
        `;

        if (totalA === 0 && totalB === 0) {
