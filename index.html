<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Решатель уравнений</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 520px;
    width: 100%;
    padding: 36px;
  }

  h1 {
    text-align: center;
    color: #4a3f8f;
    font-size: 26px;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 24px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #f0eefc;
    color: #667eea;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  .tab.active {
    background: #667eea;
    color: white;
  }

  .inputs {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .coef {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .coef label {
    font-weight: 700;
    color: #4a3f8f;
    font-size: 18px;
  }

  .coef input {
    width: 90px;
    padding: 10px;
    border: 2px solid #e0ddef;
    border-radius: 10px;
    font-size: 16px;
    text-align: center;
    outline: none;
    transition: 0.2s;
  }

  .coef input:focus {
    border-color: #667eea;
  }

  button.solve {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  button.solve:hover { opacity: 0.9; transform: translateY(-1px); }

  .result {
    margin-top: 22px;
    background: #f8f7ff;
    border-radius: 12px;
    padding: 18px;
    display: none;
    line-height: 1.6;
    color: #333;
    font-size: 15px;
  }

  .result .answer {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 700;
    color: #4a3f8f;
  }

  .error { color: #d63031; margin-top: 12px; display: none; font-size: 14px; }

  canvas {
    margin-top: 18px;
    width: 100%;
    border-radius: 12px;
    background: #fdfdff;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 Решатель уравнений</h1>
    <p class="subtitle">Квадратные и линейные — с подробным решением</p>

    <div class="tabs">
      <button class="tab active" id="tab-quad">ax² + bx + c = 0</button>
      <button class="tab" id="tab-lin">ax + b = 0</button>
    </div>

    <div class="inputs">
      <div class="coef"><label for="a">a</label><input type="number" id="a" step="any" value="1"></div>
      <div class="coef" id="wrap-b"><label for="b">b</label><input type="number" id="b" step="any" value="0"></div>
      <div class="coef" id="wrap-c"><label for="c">c</label><input type="number" id="c" step="any" value="0"></div>
    </div>

    <button class="solve" id="btn">Решить</button>

    <div class="error" id="err">Введите числа во все поля!</div>

    <div class="result" id="result"></div>
    <canvas id="chart" width="500" height="300"></canvas>
  </div>

<script>
  const quadTab = document.getElementById('tab-quad');
  const linTab = document.getElementById('tab-lin');
  const wrapB = document.getElementById('wrap-b');
  const wrapC = document.getElementById('wrap-c');
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');
  const err = document.getElementById('err');
  const chart = document.getElementById('chart');
  const ctx = chart.getContext('2d');

  let mode = 'quad';

  quadTab.onclick = () => setMode('quad');
  linTab.onclick = () => setMode('lin');

  function setMode(m) {
    mode = m;
    quadTab.classList.toggle('active', m === 'quad');
    linTab.classList.toggle('active', m === 'lin');
    wrapB.style.display = m === 'lin' ? 'none' : '';
    wrapC.style.display = m === 'lin' ? 'none' : '';
    result.style.display = 'none';
    chart.style.display = 'none';
  }

  btn.onclick = () => {
    err.style.display = 'none';
    const a = parseFloat(document.getElementById('a').value);
    const b = parseFloat(document.getElementById('b').value);
    const c = parseFloat(document.getElementById('c').value);

    if (isNaN(a) || (mode === 'quad' && (isNaN(b) || isNaN(c)))) {
      err.style.display = 'block';
      return;
    }

    if (mode === 'lin') {
      solveLinear(a, b);
    } else {
      solveQuadratic(a, b, c);
    }
  };

  function show(html) {
    result.innerHTML = html;
    result.style.display = 'block';
  }

  function fmt(x) {
    if (Number.isInteger(x)) return x.toString();
    return x.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
  }

  function solveLinear(a, b) {
    if (a === 0) {
      show(b === 0
        ? '<div class="answer">Уравнение имеет бесконечно много решений (0 = 0)</div>'
        : '<div class="answer">Уравнение не имеет решений</div>');
      return;
    }
    const x = -b / a;
    show(`<div><strong>Шаг 1:</strong> x = −b / a = ${fmt(-b)} / ${fmt(a)}</div>
          <div class="answer">x = ${fmt(x)}</div>`);
  }

  function solveQuadratic(a, b, c) {
    if (a === 0) {
      solveLinear(b, c); // уравнение вырождается в bx + c = 0
      return;
    }

    const D = b * b - 4 * a * c;
    let html = `<div>Уравнение: <strong>${fmt(a)}x² + ${fmt(b)}x + ${fmt(c)} = 0</strong></div>
                <div><strong>Дискриминант:</strong> D = b² − 4ac = ${fmt(b*b)} − ${fmt(4*a*c)} = <strong>${fmt(D)}</strong></div>`;

    if (D > 0) {
      const x1 = (-b + Math.sqrt(D)) / (2 * a);
      const x2 = (-b - Math.sqrt(D)) / (2 * a);
      html += `<div>D &gt; 0 — два различных корня</div>
               <div>x₁ = (−b + √D) / 2a = ${fmt(x1)}</div>
               <div>x₂ = (−b − √D) / 2a = ${fmt(x2)}</div>
               <div class="answer">Ответ: x₁ = ${fmt(x1)}, x₂ = ${fmt(x2)}</div>`;
    } else if (D === 0) {
      const x = -b / (2 * a);
      html += `<div>D = 0 — один корень</div>
               <div>x = −b / 2a = ${fmt(x)}</div>
               <div class="answer">Ответ: x = ${fmt(x)}</div>`;
    } else {
      const re = -b / (2 * a);
      const im = Math.sqrt(-D) / (2 * a);
      html += `<div>D &lt; 0 — действительных корней нет</div>
               <div>Корни комплексные: x = ${fmt(re)} ± ${fmt(Math.abs(im))}i</div>
               <div class="answer">Ответ: x = ${fmt(re)} ± ${fmt(Math.abs(im))}i</div>`;
    }

    show(html);
    drawParabola(a, b, c);
  }

  function drawParabola(a, b, c) {
    chart.style.display = 'block';
    const W = chart.width, H = chart.height;
    ctx.clearRect(0, 0, W, H);

    // диапазон по x: вокруг вершины или корней
    let cx = -b / (2 * a);
    let span = Math.max(4, Math.abs(cx) * 0.5 + 2);

    // масштаб, чтобы парабола помещалась
    const toX = x => W/2 + (x - cx) * (W / span) / 2;
    const ymin = [], ymax = [];
    let yMinVal = Infinity, yMaxVal = -Infinity;
    for (let i = 0; i <= 200; i++) {
      const x = cx - span/2 + span * i / 200;
      const y = a*x*x + b*x + c;
      yMinVal = Math.min(yMinVal, y);
      yMaxVal = Math.max(yMaxVal, y);
    }
    // включаем 0 в диапазон по y
    yMinVal = Math.min(yMinVal, 0);
    yMaxVal = Math.max(yMaxVal, 0);
    const ySpan = yMaxVal - yMinVal || 1;
    const toY = y => H - 20 - (y - yMinVal) * (H - 40) / ySpan;

    // оси
    ctx.strokeStyle = '#c8c4e8';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const y0 = toY(0), x0 = toX(0);
    if (y0 >= 0 && y0 <= H) { ctx.moveTo(0, y0); ctx.lineTo(W, y0); }
    if (x0 >= 0 && x0 <= W) { ctx.moveTo(x0, 0); ctx.lineTo(x0, H); }
    ctx.stroke();

    // парабола
    ctx.strokeStyle = '#667eea';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const x = cx - span/2 + span * i / 200;
      const y = a*x*x + b*x + c;
      if (i === 0) ctx.moveTo(toX(x), toY(y));
      else ctx.lineTo(toX(x), toY(y));
    }
    ctx.stroke();
  }
</script>
</body>
</html>
