<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#667eea">
<title>Решатель уравнений + Калькулятор</title>
<style>
  :root {
    --bg-grad-1: #667eea;
    --bg-grad-2: #764ba2;
    --card-bg: rgba(255, 255, 255, 0.92);
    --text-main: #2d2a4a;
    --text-soft: #7a7699;
    --accent: #667eea;
    --accent-dark: #4a3f8f;
    --input-border: #e0ddef;
    --input-bg: #ffffff;
    --result-bg: #f8f7ff;
    --key-bg: #f0eefc;
    --key-bg-active: #667eea;
    --key-fn-bg: #e8f4fd;
    --key-fn-text: #2b7bc0;
    --key-del-bg: #fdecea;
    --key-del-text: #d63031;
    --err-bg: #fdecea;
    --err-text: #d63031;
    --grid-line: #eeeafc;
    --axis-line: #c8c4e8;
    --chart-bg: #fdfdff;
    --root-dot: #e17055;
    --divider: #d5d0f0;
    --shadow: 0 20px 60px rgba(30, 20, 80, 0.35);
    --glow: 0 0 30px rgba(102, 126, 234, 0.4);
  }

  [data-theme="dark"] {
    --card-bg: rgba(30, 28, 52, 0.92);
    --text-main: #eceaff;
    --text-soft: #9a94c4;
    --accent: #8b93ff;
    --accent-dark: #b3b8ff;
    --input-border: #3d3968;
    --input-bg: #262347;
    --result-bg: #262347;
    --key-bg: #34305e;
    --key-bg-active: #667eea;
    --key-fn-bg: #2a3f5e;
    --key-fn-text: #7fc3ff;
    --key-del-bg: #4e2a35;
    --key-del-text: #ff8a94;
    --err-bg: #4e2a35;
    --err-text: #ff8a94;
    --grid-line: #2e2a52;
    --axis-line: #4a4578;
    --chart-bg: #221f40;
    --root-dot: #ff8a5c;
    --divider: #3d3968;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    --glow: 0 0 40px rgba(102, 126, 234, 0.25);
  }

  [data-theme="midnight"] {
    --bg-grad-1: #0f0c29;
    --bg-grad-2: #302b63;
    --card-bg: rgba(28, 25, 58, 0.85);
    --text-main: #eae8ff;
    --text-soft: #8f8ab8;
    --accent: #a78bfa;
    --accent-dark: #c4b5fd;
    --input-border: #3f3a70;
    --input-bg: #262250;
    --result-bg: #262250;
    --key-bg: #332e63;
    --key-bg-active: #a78bfa;
    --key-fn-bg: #2c3e63;
    --key-fn-text: #7dd3fc;
    --key-del-bg: #522a3e;
    --key-del-text: #fb7185;
    --err-bg: #522a3e;
    --err-text: #fb7185;
    --grid-line: #2d2856;
    --axis-line: #4c468a;
    --chart-bg: #211d48;
    --root-dot: #fb923c;
    --divider: #3f3a70;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
    --glow: 0 0 45px rgba(167, 139, 250, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
    background-attachment: fixed;
    transition: background 0.5s ease;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
    color: var(--text-main);
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
    animation: float 14s ease-in-out infinite alternate;
  }
  .blob-1 { width: 300px; height: 300px; background: rgba(255, 119, 198, 0.5); top: -80px; left: -80px; }
  .blob-2 { width: 260px; height: 260px; background: rgba(56, 232, 234, 0.4); bottom: -60px; right: -60px; animation-delay: -7s; }

  @keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.15); }
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 24px;
    box-shadow: var(--shadow);
    max-width: 560px;
    width: 100%;
    padding: 22px 16px;
    animation: appear 0.5s ease both;
    transition: background 0.4s ease;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  h1 { color: var(--accent-dark); font-size: 22px; letter-spacing: 0.3px; }

  .top-controls { display: flex; gap: 6px; align-items: center; }

  .theme-switch {
    display: flex;
    background: var(--key-bg);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .theme-btn, .custom-btn, .calc-btn {
    border: none;
    background: transparent;
    border-radius: 999px;
    width: 34px;
    height: 30px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.25s;
    line-height: 1;
  }
  .theme-btn.active, .custom-btn.active, .calc-btn.active {
    background: var(--accent);
    box-shadow: var(--glow);
  }
  .custom-btn, .calc-btn { background: var(--key-bg); }

  .panel {
    display: none;
    background: var(--result-bg);
    border-radius: 14px;
    padding: 14px;
    margin-top: 12px;
    animation: appear 0.3s ease both;
  }
  .panel.open { display: block; }

  .panel-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 6px 0 10px;
  }
  .panel-title:first-child { margin-top: 0; }

  .swatches {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .swatch {
    height: 44px;
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: 0.2s;
    padding: 0;
    font-size: 9px;
    color: white;
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4px;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.active { border-color: var(--text-main); box-shadow: var(--glow); }

  .panel-actions { display: flex; gap: 8px; }
  .panel-actions button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-reset { background: var(--key-bg); color: var(--text-soft); }
  .panel-actions button:active { transform: scale(0.97); }

  .subtitle { text-align: center; color: var(--text-soft); font-size: 13px; margin-bottom: 18px; }

  .input-row { display: flex; gap: 8px; }

  #eq {
    flex: 1;
    min-width: 0;
    padding: 14px 12px;
    border: 2px solid var(--input-border);
    border-radius: 14px;
    background: var(--input-bg);
    color: var(--text-main);
    font-size: 18px;
    font-family: 'Consolas', monospace;
    outline: none;
    transition: 0.25s;
  }
  #eq:focus { border-color: var(--accent); box-shadow: var(--glow); }
  #eq::placeholder { color: var(--text-soft); }

  button.solve {
    padding: 14px 18px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--btn-grad-1, #667eea), var(--btn-grad-2, #764ba2));
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
    box-shadow: 0 6px 18px rgba(102, 126, 234, 0.45);
  }
  button.solve:hover { transform: translateY(-2px); }
  button.solve:active { transform: scale(0.97); }

  .keypad {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-top: 12px;
  }
  .key {
    background: var(--key-bg);
    color: var(--accent-dark);
    border: none;
    border-radius: 10px;
    padding: 12px 0;
    font-size: 16px;
    font-weight: 600;
    font-family: 'Consolas', monospace;
    cursor: pointer;
    transition: 0.15s;
    user-select: none;
  }
  .key:active { background: var(--key-bg-active); color: white; transform: scale(0.93); }
  .key.fn { background: var(--key-fn-bg); color: var(--key-fn-text); }
  .key.del { background: var(--key-del-bg); color: var(--key-del-text); }

  .examples { display: none; }

  @media (min-width: 600px) {
    .card { padding: 36px; }
    .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; justify-content: center; }
    .ex {
      background: var(--key-bg);
      color: var(--accent);
      border: 1px solid transparent;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-family: 'Consolas', monospace;
      cursor: pointer;
      transition: 0.2s;
    }
    .ex:hover { background: var(--accent); color: white; transform: translateY(-2px); }
    .keypad { grid-template-columns: repeat(10, 1fr); }
    h1 { font-size: 26px; }
  }

  .error {
    color: var(--err-text);
    background: var(--err-bg);
    margin-top: 14px;
    display: none;
    font-size: 14px;
    border-radius: 10px;
    padding: 10px 14px;
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .result {
    margin-top: 22px;
    background: var(--result-bg);
    border-radius: 14px;
    padding: 16px;
    display: none;
    line-height: 1.7;
    color: var(--text-main);
    font-size: 15px;
    overflow-x: auto;
    animation: appear 0.35s ease both;
  }
  .result .steps div { margin: 4px 0; }
  .result .answer {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--divider);
    font-size: 19px;
    font-weight: 700;
    color: var(--accent);
    word-break: break-word;
  }

  canvas {
    margin-top: 18px;
    width: 100%;
    height: 260px;
    border-radius: 14px;
    background: var(--chart-bg);
    display: none;
    animation: appear 0.35s ease both;
  }

  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    color: var(--text-soft);
  }

  /* ==================== КАЛЬКУЛЯТОР ==================== */
  .calc-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 12, 41, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 14px;
  }
  .calc-overlay.open { display: flex; }

  .calc-box {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 20px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 400px;
    padding: 16px;
    animation: appear 0.3s ease both;
    max-height: 92vh;
    overflow-y: auto;
  }

  .calc-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .calc-head span { font-weight: 700; color: var(--accent-dark); font-size: 16px; }
  .calc-close {
    border: none;
    background: var(--key-del-bg);
    color: var(--key-del-text);
    border-radius: 999px;
    width: 30px;
    height: 30px;
    font-size: 15px;
    cursor: pointer;
    line-height: 1;
  }

  .calc-display {
    width: 100%;
    padding: 14px 12px;
    border: 2px solid var(--input-border);
    border-radius: 12px;
    background: var(--input-bg);
    color: var(--text-main);
    font-size: 20px;
    font-family: 'Consolas', monospace;
    text-align: right;
    outline: none;
  }
  .calc-display:focus { border-color: var(--accent); }

  .calc-prev {
    text-align: right;
    color: var(--text-soft);
    font-size: 13px;
    min-height: 18px;
    margin: 6px 2px 0;
    font-family: 'Consolas', monospace;
    overflow-x: auto;
    white-space: nowrap;
  }

  .calc-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: 10px;
  }
  .ckey {
    border: none;
    border-radius: 10px;
    padding: 11px 0;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Consolas', monospace;
    cursor: pointer;
    transition: 0.15s;
    user-select: none;
    background: var(--key-bg);
    color: var(--accent-dark);
  }
  .ckey:active { background: var(--key-bg-active); color: white; transform: scale(0.94); }
  .ckey.op { background: var(--key-fn-bg); color: var(--key-fn-text); }
  .ckey.eq {
    background: linear-gradient(135deg, var(--btn-grad-1, #667eea), var(--btn-grad-2, #764ba2));
    color: white;
    grid-column: span 2;
  }
  .ckey.clr { background: var(--key-del-bg); color: var(--key-del-text); }
  .ckey.wide2 { grid-column: span 2; }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <div class="top-bar">
      <h1> allator</h1>
      <div class="top-controls">
        <button class="calc-btn" id="calcBtn" title="Калькулятор">Калькулятор</button>
        <button class="custom-btn" id="customBtn" title="Настроить цвета">🎨</button>
        <div class="theme-switch" id="themes">
          <button class="theme-btn" data-theme="light" title="Светлая">☀️</button>
          <button class="theme-btn" data-theme="dark" title="Тёмная">🌙</button>
          <button class="theme-btn" data-theme="midnight" title="Полночная">🌌</button>
        </div>
      </div>
    </div>
    <p class="subtitle">Напишите уравнение — сайт сам его разберёт и решит</p>

    <!-- Панель: 10 фонов + 10 кнопок -->
    <div class="panel" id="panel">
      <div class="panel-title">Фон — 10 вариантов</div>
      <div class="swatches" id="swBg"></div>
      <div class="panel-title">Кнопка «Решить» — 10 вариантов</div>
      <div class="swatches" id="swBtn"></div>
      <div class="panel-actions">
        <button class="btn-reset" id="resetColors">Сбросить к теме</button>
      </div>
    </div>

    <div class="input-row">
      <input type="text" id="eq" placeholder="x^2 - 5x + 6 = 0" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="solve" id="btn">Решить</button>
    </div>

    <!-- Клавиатурка -->
    <div class="keypad" id="keypad">
      <button class="key" data-ins="7">7</button>
      <button class="key" data-ins="8">8</button>
      <button class="key" data-ins="9">9</button>
      <button class="key" data-ins="/">÷</button>
      <button class="key" data-ins="(">(</button>
      <button class="key del" data-del="1">⌫</button>
      <button class="key" data-ins="4">4</button>
      <button class="key" data-ins="5">5</button>
      <button class="key" data-ins="6">6</button>
      <button class="key" data-ins="*">×</button>
      <button class="key" data-ins=")">)</button>
      <button class="key" data-ins="=">=</button>
      <button class="key" data-ins="1">1</button>
      <button class="key" data-ins="2">2</button>
      <button class="key" data-ins="3">3</button>
      <button class="key" data-ins="-">−</button>
      <button class="key" data-ins="^">x^</button>
      <button class="key" data-ins="x">x</button>
      <button class="key" data-ins="0">0</button>
      <button class="key" data-ins=".">,</button>
      <button class="key" data-ins="+">+</button>
      <button class="key fn" data-ins="sqrt(">√</button>
      <button class="key fn" data-ins="sin(">sin</button>
      <button class="key fn" data-ins="cos(">cos</button>
      <button class="key fn" data-ins="tan(">tg</button>
      <button class="key fn" data-ins="pi">π</button>
      <button class="key fn" data-ins="ln(">ln</button>
      <button class="key fn" data-ins="log(">log</button>
      <button class="key fn" data-ins="abs(">|a|</button>
      <button class="key fn" data-ins="e">e</button>
      <button class="key fn" data-clear="1">Очистить</button>
    </div>

    <div class="examples">
      <button class="ex">x^2 - 5x + 6 = 0</button>
      <button class="ex">2x + 3 = 5</button>
      <button class="ex">x^3 - 6x^2 + 11x - 6 = 0</button>
      <button class="ex">(x+1)(x-3) = 0</button>
      <button class="ex">x/2 + 1 = x/3 - 2</button>
      <button class="ex">sin(x) = 0.5</button>
      <button class="ex">2^x = 16</button>
    </div>

    <div class="error" id="err"></div>
    <div class="result" id="result"></div>
    <canvas id="chart" width="540" height="300"></canvas>

    <div class="footer">Сайт создали: giver | uno</div>
  </div>

  <!-- ==================== КАЛЬКУЛЯТОР ==================== -->
  <div class="calc-overlay" id="calcOverlay">
    <div class="calc-box">
      <div class="calc-head">
        <span>🖩 Калькулятор</span>
        <button class="calc-close" id="calcClose">✕</button>
      </div>
      <input type="text" class="calc-display" id="calcDisplay" placeholder="0">
      <div class="calc-prev" id="calcPrev"></div>
      <div class="calc-grid">
        <button class="ckey clr" data-cins="C">C</button>
        <button class="ckey" data-cins="(">(</button>
        <button class="ckey" data-cins=")">)</button>
        <button class="ckey" data-cins="%">%</button>
        <button class="ckey op" data-cdel="1">⌫</button>

        <button class="ckey op" data-cins="sin(">sin</button>
        <button class="ckey op" data-cins="cos(">cos</button>
        <button class="ckey op" data-cins="tan(">tan</button>
        <button class="ckey op" data-cins="pi">π</button>
        <button class="ckey op" data-cins="^">x^y</button>

        <button class="ckey op" data-cins="asin(">sin⁻¹</button>
        <button class="ckey op" data-cins="acos(">cos⁻¹</button>
        <button class="ckey op" data-cins="atan(">tan⁻¹</button>
        <button class="ckey op" data-cins="e">e</button>
        <button class="ckey op" data-cins="!">n!</button>

        <button class="ckey op" data-cins="sqrt(">√</button>
        <button class="ckey op" data-cins="^2">x²</button>
        <button class="ckey op" data-cins="ln(">ln</button>
        <button class="ckey op" data-cins="log(">log</button>
        <button class="ckey op" data-cins="exp(">e^x</button>

        <button class="ckey" data-cins="7">7</button>
        <button class="ckey" data-cins="8">8</button>
        <button class="ckey" data-cins="9">9</button>
        <button class="ckey op" data-cins="/">÷</button>
        <button class="ckey op" data-cins="abs(">|a|</button>

        <button class="ckey" data-cins="4">4</button>
        <button class="ckey" data-cins="5">5</button>
        <button class="ckey" data-cins="6">6</button>
        <button class="ckey op" data-cins="*">×</button>
        <button class="ckey op" data-cins="x">Ans</button>

        <button class="ckey" data-cins="1">1</button>
        <button class="ckey" data-cins="2">2</button>
        <button class="ckey" data-cins="3">3</button>
        <button class="ckey op" data-cins="-">−</button>
        <button class="ckey op" data-cins="sinh(">sh</button>

        <button class="ckey" data-cins="0">0</button>
        <button class="ckey" data-cins=".">,</button>
        <button class="ckey op" data-cins="+">+</button>
        <button class="ckey eq" data-ceq="1">=</button>
      </div>
    </div>
  </div>

<script>
// ==================== ПАРСЕР ====================
function tokenize(s) {
  s = s.replace(/√/g, 'sqrt').replace(/·|×/g, '*').replace(/−/g, '-').replace(/,/g, '.').replace(/π/g, 'pi');
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === ' ') { i++; continue; }
    if (/[0-9.]/.test(c)) {
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      tokens.push({ t: 'num', v: parseFloat(s.slice(i, j)) });
      i = j;
    } else if (/[a-zA-Z]/.test(c)) {
      let j = i;
      while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
      tokens.push({ t: 'id', v: s.slice(i, j).toLowerCase() });
      i = j;
    } else if ('+-*/^()=!%'.includes(c)) {
      tokens.push({ t: c });
      i++;
    } else {
      throw new Error('непонятный символ: «' + c + '»');
    }
  }
  return tokens;
}

const FUNCS = ['sin', 'cos', 'tan', 'tg', 'sqrt', 'ln', 'log', 'abs', 'exp',
               'asin', 'acos', 'atan', 'sinh', 'cosh', 'tanh'];
const CONSTS = { pi: Math.PI, e: Math.E };

function factorial(n) {
  if (n < 0 || !Number.isInteger(n)) throw new Error('факториал только для целых неотрицательных чисел');
  if (n > 170) return Infinity;
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}

function parse(tokens) {
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];

  function parseExpr() {
    let node = parseTerm();
    while (peek() && (peek().t === '+' || peek().t === '-')) {
      const op = next().t;
      node = { t: 'op', op, l: node, r: parseTerm() };
    }
    return node;
  }

  function parseTerm() {
    let node = parseUnary();
    for (;;) {
      const p = peek();
      if (p && (p.t === 'id' || p.t === 'num' || p.t === '(') && node.t !== 'op') {
        node = { t: 'op', op: '*', l: node, r: parseUnary() };
        continue;
      }
      if (p && p.t === '*') { next(); node = { t: 'op', op: '*', l: node, r: parseUnary() }; continue; }
      if (p && p.t === '/') { next(); node = { t: 'op', op: '/', l: node, r: parseUnary() }; continue; }
      break;
    }
    return node;
  }

  function parseUnary() {
    if (peek() && peek().t === '-') { next(); return { t: 'op', op: '-', l: { t: 'num', v: 0 }, r: parseUnary() }; }
    if (peek() && peek().t === '+') { next(); return parseUnary(); }
    return parsePostfix(parsePower());
  }

  // постфиксные операции: факториал ! и процент %
  function parsePostfix(node) {
    for (;;) {
      const p = peek();
      if (p && p.t === '!') { next(); node = { t: 'fn', name: 'fact', arg: node }; continue; }
      if (p && p.t === '%') { next(); node = { t: 'op', op: '/', l: node, r: { t: 'num', v: 100 } }; continue; }
      break;
    }
    return node;
  }

  function parsePower() {
    const base = parsePrimary();
    if (peek() && peek().t === '^') { next(); return { t: 'op', op: '^', l: base, r: parseUnary() }; }
    return base;
  }

  function parsePrimary() {
    const p = next();
    if (!p) throw new Error('выражение обрывается');
    if (p.t === 'num') return { t: 'num', v: p.v };
    if (p.t === '(') {
      const inner = parseExpr();
      if (!peek() || peek().t !== ')') throw new Error('не закрыта скобка');
      next();
      return inner;
    }
    if (p.t === 'id') {
      if (p.v === 'x') return { t: 'x' };
      if (CONSTS[p.v] !== undefined) return { t: 'num', v: CONSTS[p.v] };
      if (FUNCS.includes(p.v)) {
        let arg;
        if (peek() && peek().t === '(') { next(); arg = parseExpr(); if (!peek() || peek().t !== ')') throw new Error('не закрыта скобка'); next(); }
        else arg = parsePower();
        return { t: 'fn', name: p.v === 'tg' ? 'tan' : p.v, arg };
      }
      throw new Error('неизвестное имя: «' + p.v + '»');
    }
    throw new Error('неожиданный символ в выражении');
  }

  const node = parseExpr();
  if (pos < tokens.length) throw new Error('лишние символы в конце');
  return node;
}

function evalNode(node, x) {
  switch (node.t) {
    case 'num': return node.v;
    case 'x': return x;
    case 'op': {
      const a = evalNode(node.l, x), b = evalNode(node.r, x);
      switch (node.op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return a / b;
        case '^': return Math.pow(a, b);
      }
    }
    case 'fn': {
      const a = evalNode(node.arg, x);
      switch (node.name) {
        case 'sin': return Math.sin(a);
        case 'cos': return Math.cos(a);
        case 'tan': return Math.tan(a);
        case 'asin': return Math.asin(a);
        case 'acos': return Math.acos(a);
        case 'atan': return Math.atan(a);
        case 'sinh': return Math.sinh(a);
        case 'cosh': return Math.cosh(a);
        case 'tanh': return Math.tanh(a);
        case 'sqrt': return a < 0 ? NaN : Math.sqrt(a);
        case 'ln': return a <= 0 ? NaN : Math.log(a);
        case 'log': return a <= 0 ? NaN : Math.log10(a);
        case 'abs': return Math.abs(a);
        case 'exp': return Math.exp(a);
        case 'fact': return factorial(a);
      }
    }
  }
}

function hasX(node) {
  if (node.t === 'x') return true;
  if (node.t === 'op') return hasX(node.l) || hasX(node.r);
  if (node.t === 'fn') return hasX(node.arg);
  return false;
}

function toPoly(node, maxDeg) {
  if (node.t === 'num') return [node.v];
  if (node.t === 'x') return [0, 1];
  if (node.t === 'fn') return null;
  if (node.t === 'op') {
    const L = toPoly(node.l, maxDeg), R = toPoly(node.r, maxDeg);
    if (!L || !R) return null;
    if (node.op === '+' || node.op === '-') {
      const out = new Array(Math.max(L.length, R.length)).fill(0);
      for (let i = 0; i < L.length; i++) out[i] += L[i];
      for (let i = 0; i < R.length; i++) out[i] += (node.op === '+' ? R[i] : -R[i]);
      return out.length > maxDeg + 1 ? null : out;
    }
    if (node.op === '*') {
      const out = new Array(L.length + R.length - 1).fill(0);
      for (let i = 0; i < L.length; i++)
        for (let j = 0; j < R.length; j++) out[i + j] += L[i] * R[j];
      return out.length > maxDeg + 1 ? null : out;
    }
    if (node.op === '^') {
      if (node.r.t !== 'num' || !Number.isInteger(node.r.v) || node.r.v < 0 || node.r.v > maxDeg) return null;
      let out = [1];
      for (let k = 0; k < node.r.v; k++) {
        const tmp = new Array(out.length + L.length - 1).fill(0);
        for (let i = 0; i < out.length; i++)
          for (let j = 0; j < L.length; j++) tmp[i + j] += out[i] * L[j];
        out = tmp;
      }
      return out.length > maxDeg + 1 ? null : out;
    }
  }
  return null;
}

function findRoots(f) {
  const roots = [];
  const ranges = [10, 100, 1000];
  let R = 10;
  for (const r of ranges) {
    R = r;
    roots.length = 0;
    let prevX = -R, prevY = f(-R);
    for (let x = -R + R / 20000; x <= R; x += R / 20000) {
      const y = f(x);
      if (isFinite(y) && isFinite(prevY)) {
        if (prevY * y <= 0 && Math.abs(y - prevY) < 1e6 * Math.max(Math.abs(y), 1)) {
          let lo = prevX, hi = x;
          for (let k = 0; k < 80; k++) {
            const mid = (lo + hi) / 2;
            const fm = f(mid);
            if (!isFinite(fm)) break;
            if (f(lo) * fm <= 0) hi = mid; else lo = mid;
          }
          const root = (lo + hi) / 2;
          if (Math.abs(f(root)) < 1e-6 && !roots.some(r0 => Math.abs(r0 - root) < 1e-6))
            roots.push(root);
        }
        if (Math.abs(y) < 1e-12 && !roots.some(r0 => Math.abs(r0 - x) < 1e-6)) roots.push(x);
      }
      prevX = x; prevY = y;
      if (roots.length >= 12) break;
    }
    if (roots.length) break;
  }
  return roots;
}

const eqInput = document.getElementById('eq');

function fmt(x) {
  if (Number.isInteger(x)) return x.toString();
  return (+x.toFixed(4)).toString();
}

function polyStr(coeffs) {
  const parts = [];
  for (let i = coeffs.length - 1; i >= 0; i--) {
    if (Math.abs(coeffs[i]) < 1e-12) continue;
    const sign = coeffs[i] < 0 ? '− ' : (parts.length ? '+ ' : '');
    const abs = Math.abs(coeffs[i]);
    if (i === 0) parts.push(sign + fmt(abs));
    else if (i === 1) parts.push(sign + (abs === 1 ? '' : fmt(abs)) + 'x');
    else parts.push(sign + (abs === 1 ? '' : fmt(abs)) + 'x^' + i);
  }
  return parts.length ? parts.join(' ') : '0';
}

function solve() {
  err.style.display = 'none';
  result.style.display = 'none';
  chart.style.display = 'none';

  const raw = eqInput.value.trim();
  if (!raw) return;

  try {
    const eqParts = raw.split('=');
    if (eqParts.length !== 2) throw new Error('нужен ровно один знак «=»');
    const L = parse(tokenize(eqParts[0]));
    const R = parse(tokenize(eqParts[1]));
    if (!hasX(L) && !hasX(R)) throw new Error('в уравнении нет переменной x');

    const F = { t: 'op', op: '-', l: L, r: R };
    const f = x => evalNode(F, x);

    const steps = [];
    let answer = '';

    const poly = toPoly(F, 8);
    if (poly) {
      while (poly.length > 1 && Math.abs(poly[poly.length - 1]) < 1e-12) poly.pop();
      const deg = poly.length - 1;
      steps.push('Переносим всё в левую часть: ' + polyStr(poly) + ' = 0');

      if (deg === 0) {
        answer = Math.abs(poly[0]) < 1e-12 ? 'Верно при любом x' : 'Решений нет';
      } else if (deg === 1) {
        const x = -poly[0] / poly[1];
        steps.push('Это линейное уравнение: x = ' + fmt(-poly[0]) + ' / ' + fmt(poly[1]));
        answer = 'x = ' + fmt(x);
        drawPlot(f, [x]);
      } else if (deg === 2) {
        const a = poly[2], b = poly[1], c = poly[0];
        const D = b * b - 4 * a * c;
        steps.push('Дискриминант: D = b² − 4ac = ' + fmt(b * b) + ' − ' + fmt(4 * a * c) + ' = ' + fmt(D));
        if (D > 0) {
          const x1 = (-b + Math.sqrt(D)) / (2 * a), x2 = (-b - Math.sqrt(D)) / (2 * a);
          steps.push('D > 0 — два корня');
          answer = 'x₁ = ' + fmt(x1) + ', x₂ = ' + fmt(x2);
          drawPlot(f, [x1, x2]);
        } else if (Math.abs(D) < 1e-12) {
          const x = -b / (2 * a);
          steps.push('D = 0 — один корень');
          answer = 'x = ' + fmt(x);
          drawPlot(f, [x]);
        } else {
          const re = -b / (2 * a), im = Math.sqrt(-D) / (2 * a);
          steps.push('D < 0 — действительных корней нет');
          answer = 'x = ' + fmt(re) + ' ± ' + fmt(Math.abs(im)) + 'i';
          drawPlot(f, []);
        }
      } else {
        const roots = findRoots(f);
        if (roots.length) {
          steps.push('Уравнение степени ' + deg + ' — находим корни численно');
          answer = 'x ≈ ' + roots.map(r => (+r.toFixed(6)).toString()).join(', ');
        } else {
          steps.push('Уравнение степени ' + deg);
          answer = 'Действительных корней не найдено';
        }
        drawPlot(f, roots);
      }
    } else {
      steps.push('Уравнение с функциями — решаем численно');
      const roots = findRoots(f);
      if (roots.length) {
        answer = 'x ≈ ' + roots.map(r => (+r.toFixed(6)).toString()).join(',  ');
        steps.push('Найдено корней: ' + roots.length + ' (в диапазоне поиска)');
      } else {
        answer = 'Действительных корней не найдено (возможно, их нет или они далеко)';
      }
      drawPlot(f, roots);
    }

    result.innerHTML =
      '<div class="steps">' + steps.map(s => '<div>' + s + '</div>').join('') + '</div>' +
      '<div class="answer">' + answer + '</div>';
    result.style.display = 'block';
  } catch (e) {
    err.textContent = 'Не получилось разобрать уравнение: ' + e.message;
    err.style.display = 'block';
  }
}

let gridCol = '#eeeafc', axisCol = '#c8c4e8', curveCol = '#667eea', rootCol = '#e17055';
let lastF = null, lastRoots = [];

function scheduleChartRedraw() {
  if (lastF) setTimeout(() => drawPlot(lastF, lastRoots), 60);
}

function readChartColors() {
  const m = getComputedStyle(document.documentElement);
  gridCol = m.getPropertyValue('--grid-line').trim();
  axisCol = m.getPropertyValue('--axis-line').trim();
  curveCol = m.getPropertyValue('--accent').trim();
  rootCol = m.getPropertyValue('--root-dot').trim();
}

function drawPlot(f, roots) {
  lastF = f; lastRoots = roots;
  readChartColors();

  chart.style.display = 'block';
  const dpr = window.devicePixelRatio || 1;
  const cssW = chart.clientWidth || 500;
  const cssH = 260;
  chart.width = cssW * dpr;
  chart.height = cssH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cssW, H = cssH;
  ctx.clearRect(0, 0, W, H);

  let cx = 0, span = 10;
  if (roots.length) {
    cx = roots.reduce((s, r) => s + r, 0) / roots.length;
    const spread = Math.max(...roots.map(r => Math.abs(r - cx)));
    span = Math.max(6, spread * 2.5 + 2, Math.abs(cx) * 0.6 + 3);
  }

  const toX = x => W / 2 + (x - cx) * (W / span) / 2;
  let yMin = Infinity, yMax = -Infinity;
  const N = 400;
  for (let i = 0; i <= N; i++) {
    const y = f(cx - span / 2 + span * i / N);
    if (isFinite(y)) { yMin = Math.min(yMin, y); yMax = Math.max(yMax, y); }
  }
  if (!isFinite(yMin)) { yMin = -5; yMax = 5; }
  yMin = Math.min(yMin, 0); yMax = Math.max(yMax, 0);
  let ySpan = yMax - yMin || 1;
  if (ySpan > span * 2) ySpan = span * 2;
  const yMid = (yMin + yMax) / 2;
  const toY = y => H / 2 - Math.max(-ySpan / 2, Math.min(ySpan / 2, y - yMid)) * (H - 30) / ySpan;

  ctx.strokeStyle = gridCol; ctx.lineWidth = 1;
  for (let gx = 0; gx <= W; gx += W / 12) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }

  ctx.strokeStyle = axisCol;
  const y0 = toY(0), x0 = toX(0);
  if (y0 >= 0 && y0 <= H) { ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke(); }
  if (x0 >= 0 && x0 <= W) { ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, H); ctx.stroke(); }

  ctx.strokeStyle = curveCol; ctx.lineWidth = 3;
  ctx.beginPath();
  let started = false, prevY = null;
  for (let i = 0; i <= N; i++) {
    const x = cx - span / 2 + span * i / N;
    const y = f(x);
    if (!isFinite(y)) { started = false; prevY = null; continue; }
    if (prevY !== null && Math.abs(y - prevY) > ySpan) started = false;
    const py = toY(y);
    if (py < -H || py > 2 * H) { started = false; prevY = y; continue; }
    if (!started) { ctx.moveTo(toX(x), py); started = true; }
    else ctx.lineTo(toX(x), py);
    prevY = y;
  }
  ctx.stroke();

  ctx.fillStyle = rootCol;
  roots.forEach(r => {
    ctx.beginPath();
    ctx.arc(toX(r), toY(0), 6, 0, Math.PI * 2);
    ctx.fill();
  });
}
</script>
