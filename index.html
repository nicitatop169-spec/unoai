        }
        .step-1 {
            background-color: #ebf8ff;
            stepsHtml += `<div class="step step-1">🔵 <b>Шаг 1. Переносим x влево, числа вправо:</b><br> <span class="math-highlight">${left.x}x ${right.x >= 0 ? '- ' + right.x : '+ ' + Math.abs(right.x)}x = ${right.c} ${left.c >= 0 ? '- ' + left.c : '+ ' + Math.abs(left.c)}</span></div>`;
            stepsHtml += `<div class="step step-2">🟣 <b>Шаг 2. Приводим подобные слагаемые:</b><br> <span class="math-highlight">${totalX}x = ${totalC}</span></div>`;

            if (totalX === 0) {
                if (totalC === 0) {
                    stepsHtml += `<div class="final-answer">🎉 Ответ: x — любое число</div>`;
                } else {
                    stepsHtml += `<div class="final-answer" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">🚫 Ответ: корней нет</div>`;
                }
            } else {
                const answer = Number((totalC / totalX).toFixed(4));
                stepsHtml += `<div class="step step-3">🟠 <b>Шаг 3. Находим x делением:</b><br> <span class="math-highlight">x = ${totalC} / ${totalX}</span></div>`;
                stepsHtml += `<div class="final-answer">✅ Ответ: x = ${answer}</div>`;
            }

            resultDiv.innerHTML = stepsHtml;

        } catch (e) {
            showError('⚠️ Произошла ошибка при вычислении.');
        }
    }

    function showError(msg) {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `<div class="error-box">${msg}</div>`;
    }
</script>

<body>

<div class="container">
    <h1>✨ ГДЗ: Супер-Решатель</h1>
    <p class="subtitle">Введи уравнение с переменной <b>x</b> и получи яркий разбор</p>

    <div class="input-group">
        <input type="text" id="equationInput" placeholder="Например: 2x + 5 = 15" value="2x + 5 = 15" onkeydown="if(event.key === 'Enter') solveEquation()">
        <button type="button" onclick="solveEquation()">Решить 🚀</button>
    </div>

    <div class="examples">
        <b>Примеры:</b>
        <span onclick="setExample('3x - 7 = 14')">3x - 7 = 14</span>
        <span onclick="setExample('5x + 2 = 3x + 10')">5x + 2 = 3x + 10</span>
        <span onclick="setExample('-2x + 8 = 0')">-2x + 8 = 0</span>
    </div>

    <div id="result" class="result-box"></div>
</div>

<script>
    function setExample(eq) {
        document.getElementById('equationInput').value = eq;
        solveEquation();
    }

    function parseSide(side) {
        side = side.replace(/\s+/g, '').replace(/х/gi, 'x').toLowerCase();
        const terms = side.match(/[+-]?[^+-]+/g) || [];
        
        let xCoeff = 0;
        let constant = 0;

        for (let term of terms) {
            if (term.includes('x')) {
                let coeffStr = term.replace('x', '');
                if (coeffStr === '' || coeffStr === '+') xCoeff += 1;
                else if (coeffStr === '-') xCoeff -= 1;
                else xCoeff += parseFloat(coeffStr);
            } else {
                constant += parseFloat(term);
            }
        }
        return { x: xCoeff, c: constant };
    }

    function solveEquation() {
        const input = document.getElementById('equationInput').value;
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        if (!input.includes('=')) {
            showError('⚠️ Ошибка: в уравнении должен быть знак равенства (=).');
            return;
        }

        const sides = input.split('=');
        if (sides.length !== 2 || !sides[0].trim() || !sides[1].trim()) {
            showError('⚠️ Ошибка: проверь правильность записи уравнения.');
            return;
        }

        try {
            const left = parseSide(sides[0]);
            const right = parseSide(sides[1]);

            if (isNaN(left.x) || isNaN(left.c) || isNaN(right.x) || isNaN(right.c)) {
                showError('⚠️ Ошибка: используй только числа, знаки +, - и букву x.');
                return;
            }

            const totalX = left.x - right.x;
            const totalC = right.c - left.c;

            let stepsHtml = `<div class="step step-0">📝 <b>Уравнение:</b> <span class="math-highlight">${input}</span></div>`;
