<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Решатель уравнений</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 560px;
    width: 100%;
    padding: 36px;
  }

  h1 {
    text-align: center;
    color: #4a3f8f;
    font-size: 26px;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 24px;
  }

  .type-select {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0ddef;
    border-radius: 10px;
    font-size: 15px;
    color: #4a3f8f;
    font-weight: 600;
    background: #f8f7ff;
    outline: none;
    cursor: pointer;
    margin-bottom: 20px;
  }

  .type-select:focus { border-color: #667eea; }

  .inputs {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .coef {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .coef label {
    font-weight: 700;
    color: #4a3f8f;
    font-size: 17px;
  }

  .coef input {
    width: 85px;
    padding: 10px;
    border: 2px solid #e0ddef;
    border-radius: 10px;
    font-size: 16px;
    text-align: center;
    outline: none;
    transition: 0.2s;
  }

  .coef input:focus { border-color: #667eea; }

  .eq-preview {
    text-align: center;
    color: #667eea;
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 14px;
    min-height: 22px;
  }

  .system-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .system-row .bracket {
    font-size: 26px;
    color: #667eea;
    font-weight: 300;
  }

  .mini {
    width: 70px;
    padding: 8px;
    border: 2px solid #e0ddef;
    border-radius: 8px;
    font-size: 15px;
    text-align: center;
    outline: none;
  }

  .mini:focus { border-color: #667eea; }

  button.solve {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  button.solve:hover { opacity: 0.9; transform: translateY(-1px); }

  .result {
    margin-top: 22px;
    background: #f8f7ff;
    border-radius: 12px;
    padding: 18px;
    display: none;
    line-height: 1.6;
    color: #333;
    font-size: 15px;
  }

  .result .answer {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 700;
    color: #4a3f8f;
  }

  .error { color: #d63031; margin-top: 12px; display: none; font-size: 14px; }

  canvas {
    margin-top: 18px;
    width: 100%;
    border-radius: 12px;
    background: #fdfdff;
    display: none;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 Решатель уравнений</h1>
    <p class="subtitle">Линейные, квадратные, биквадратные, кубические и системы</p>

    <select class="type-select" id="type">
      <option value="lin">Линейное: ax + b = 0</option>
      <option value="quad" selected>Квадратное: ax² + bx + c = 0</option>
      <option value="biquad">Биквадратное: ax⁴ + bx² + c = 0</option>
      <option value="cubic">Кубическое: ax³ + bx² + cx + d = 0</option>
      <option value="sys">Система: a₁x + b₁y = c₁; a₂x + b₂y = c₂</option>
    </select>

    <!-- Линейное -->
    <div class="inputs" id="in-lin">
      <div class="coef"><label for="la">a</label><input type="number" id="la" step="any" value="2"></div>
      <div class="coef"><label for="lb">b</label><input type="number" id="lb" step="any" value="-8"></div>
    </div>

    <!-- Квадратное -->
    <div class="inputs" id="in-quad">
      <div class="coef"><label for="qa">a</label><input type="number" id="qa" step="any" value="1"></div>
      <div class="coef"><label for="qb">b</label><input type="number" id="qb" step="any" value="-3"></div>
      <div class="coef"><label for="qc">c</label><input type="number" id="qc" step="any" value="2"></div>
    </div>

    <!-- Биквадратное -->
    <div class="inputs" id="in-biquad">
      <div class="coef"><label for="ba">a</label><input type="number" id="ba" step="any" value="1"></div>
      <div class="coef"><label for="bb">b</label><input type="number" id="bb" step="any" value="-5"></div>
      <div class="coef"><label for="bc">c</label><input type="number" id="bc" step="any" value="4"></div>
    </div>

    <!-- Кубическое -->
    <div class="inputs" id="in-cubic">
      <div class="coef"><label for="ca">a</label><input type="number" id="ca" step="any" value="1"></div>
      <div class="coef"><label for="cb">b</label><input type="number" id="cb" step="any" value="-6"></div>
      <div class="coef"><label for="cc">c</label><input type="number" id="cc" step="any" value="11"></div>
      <div class="coef"><label for="cd">d</label><input type="number" id="cd" step="any" value="-6"></div>
    </div>

    <!-- Система -->
    <div class="hidden" id="in-sys">
      <div class="system-row">
        <span class="bracket">{</span>
        <input type="number" class="mini" id="s1a" step="any" value="2">
        <span style="font-weight:700;color:#4a3f8f">x +</span>
        <input type="number" class="mini" id="s1b" step="any" value="3">
        <span style="font-weight:700;color:#4a3f8f">y =</span>
        <input type="number" class="mini" id="s1c" step="any" value="13">
      </div>
      <div class="system-row">
        <span class="bracket" style="visibility:hidden">{</span>
        <input type="number" class="mini" id="s2a" step="any" value="1">
        <span style="font-weight:700;color:#4a3f8f">x +</span>
        <input type="number" class="mini" id="s2b" step="any" value="-1">
        <span style="font-weight:700;color:#4a3f8f">y =</span>
        <input type="number" class="mini" id="s2c" step="any" value="1">
      </div>
    </div>

    <div class="eq-preview" id="preview"></div>

    <button class="solve" id="btn">Решить</button>

    <div class="error" id="err">Введите числа во все поля!</div>

    <div class="result" id="result"></div>
    <canvas id="chart" width="540" height="320"></canvas>
  </div>

<script>
  const typeSelect = document.getElementById('type');
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');
  const err = document.getElementById('err');
  const chart = document.getElementById('chart');
  const ctx = chart.getContext('2d');
  const preview = document.getElementById('preview');

  const inputsMap = {
    lin:   ['in-lin'],
    quad:  ['in-quad'],
    biquad:['in-biquad'],
    cubic: ['in-cubic'],
    sys:   ['in-sys']
  };

  function fmt(x) {
    if (Number.isInteger(x)) return x.toString();
    return +x.toFixed(6) + '';
  }

  // показываем нужные поля
  typeSelect.onchange = () => {
    Object.entries(inputsMap).forEach(([k, ids]) => {
      document.getElementById(k === 'sys' ? 'in-sys' : 'in-' + k)
        .classList.toggle('hidden', k !== typeSelect.value);
    });
    result.style.display = 'none';
    chart.style.display = 'none';
    err.style.display = 'none';
  };

  // живой предпросмотр уравнения
  document.querySelectorAll('input').forEach(i => i.addEventListener('input', updatePreview));

  function signTerm(v, first) {
    const s = v < 0 ? '− ' : (first ? '' : '+ ');
    return s + fmt(Math.abs(v));
  }

  function updatePreview() {
    const t = typeSelect.value;
    const v = id => parseFloat(document.getElementById(id).value) || 0;
    if (t === 'lin') preview.textContent = `${signTerm(v('la'), true)}x ${signTerm(v('lb'))} = 0`;
    if (t === 'quad') preview.textContent = `${signTerm(v('qa'), true)}x² ${signTerm(v('qb'))}x ${signTerm(v('qc'))} = 0`;
    if (t === 'biquad') preview.textContent = `${signTerm(v('ba'), true)}x⁴ ${signTerm(v('bb'))}x² ${signTerm(v('bc'))} = 0`;
    if (t === 'cubic') preview.textContent = `${signTerm(v('ca'), true)}x³ ${signTerm(v('cb'))}x² ${signTerm(v('cc'))}x ${signTerm(v('cd'))} = 0`;
    if (t === 'sys') preview.textContent = '';
  }
  updatePreview();

  btn.onclick = () => {
    err.style.display = 'none';
    result.style.display = 'none';
    chart.style.display = 'none';
    const t = typeSelect.value;
    const val = id => {
      const n = parseFloat(document.getElementById(id).value);
      if (isNaN(n)) { err.style.display = 'block'; return null; }
      return n;
    };
    if (t === 'lin') solveLin(val('la'), val('lb'));
    if (t === 'quad') solveQuad(val('qa'), val('qb'), val('qc'));
    if (t === 'biquad') solveBiQuad(val('ba'), val('bb'), val('bc'));
    if (t === 'cubic') solveCubic(val('ca'), val('cb'), val('cc'), val('cd'));
    if (t === 'sys') solveSystem(val('s1a'), val('s1b'), val('s1c'), val('s2a'), val('s2b'), val('s2c'));
  };

  function show(html) {
    result.innerHTML = html;
    result.style.display = 'block';
  }

  function solveLin(a, b) {
    if (a === 0) {
      show(b === 0
        ? '<div class="answer">Бесконечно много решений (0 = 0)</div>'
        : '<div class="answer">Решений нет</div>');
      return;
    }
    const x = -b / a;
    show(`<div><strong>Шаг:</strong> x = −b / a = ${fmt(-b)} / ${fmt(a)}</div>
          <div class="answer">x = ${fmt(x)}</div>`);
    drawFunction(a => 0, [{ a: a, b: b }], [], 1);
  }

  function solveQuad(a, b, c) {
    if (a === 0) return solveLin(b, c);
    const D = b * b - 4 * a * c;
    let html = `<div><strong>Дискриминант:</strong> D = b² − 4ac = ${fmt(b*b)} − ${fmt(4*a*c)} = <strong>${fmt(D)}</strong></div>`;
    if (D > 0) {
      const x1 = (-b + Math.sqrt(D)) / (2 * a), x2 = (-b - Math.sqrt(D)) / (2 * a);
      html += `<div>D &gt; 0 — два корня</div>
               <div class="answer">x₁ = ${fmt(x1)}, x₂ = ${fmt(x2)}</div>`;
    } else if (D === 0) {
      const x = -b / (2 * a);
      html += `<div>D = 0 — один корень</div>
               <div class="answer">x = ${fmt(x)}</div>`;
    } else {
      const re = -b / (2 * a), im = Math.sqrt(-D) / (2 * a);
      html += `<div>D &lt; 0 — действительных корней нет</div>
               <div class="answer">x = ${fmt(re)} ± ${fmt(Math.abs(im))}i</div>`;
    }
    show(html);
    drawFunction(null, [{a:a, b:b, c:c}], [], 2);
  }

  function solveBiQuad(a, b, c) {
    if (a === 0) return solveQuad(b, c);
    const D = b * b - 4 * a * c;
    let html = `<div>Замена: <strong>t = x²</strong>, тогда at² + bt + c = 0</div>
                <div><strong>Дискриминант:</strong> D = ${fmt(b*b)} − ${fmt(4*a*c)} = <strong>${fmt(D)}</strong></div>`;
    let roots = [];
    if (D < 0) {
      html += `<div>D &lt; 0 — t² не может быть отрицательным корней нет... вернее, корней у уравнения нет</div>
               <div class="answer">Действительных корней нет</div>`;
      show(html);
      drawFunction(null, [{a:a, b:0, c:b, d:c}], [], 4);
      return;
    }
    const t1 = (-b + Math.sqrt(D)) / (2 * a);
    const t2 = (-b - Math.sqrt(D)) / (2 * a);
    [t1, t2].forEach(t => {
      if (t > 0) {
        const r = Math.sqrt(t);
        roots.push(r, -r);
        html += `<div>t = ${fmt(t)} &gt; 0 → x = ±√${fmt(t)} = ±${fmt(r)}</div>`;
      } else if (t === 0) {
        roots.push(0);
        html += `<div>t = 0 → x = 0</div>`;
      } else {
        html += `<div>t = ${fmt(t)} &lt; 0 — корней не даёт (x² не может быть отрицательным)</div>`;
      }
    });
    roots = [...new Set(roots.map(r => +r.toFixed(10)))];
    html += `<div class="answer">Ответ: ${roots.length ? 'x = ' + roots.map(fmt).join(', ') : 'корней нет'}</div>`;
    show(html);
    drawFunction(null, [{a:a, b:0, c:b, d:c}], roots, 4);
  }

  function solveCubic(a, b, c, d) {
    if (a === 0) return solveQuad(b, c, d);
    let html = `<div>Ищем рациональные корни среди делителей свободного члена (метод подбора)</div>`;
    const roots = [];
    // подбираем целые корни
    const cand = [];
    const absD = Math.abs(d) || 1;
    for (let i = 1; i <= absD; i++) {
      if (absD % i === 0) cand.push(i, -i);
    }
    let rest = [a, b, c, d];
    let k = 0;
    for (const r of cand) {
      if (k >= 2) break;
      if (Math.abs(polyVal(rest, 3, r)) < 1e-9) {
        roots.push(r);
        rest = divideByRoot(rest, r);
        html += `<div>Целый корень: x = ${fmt(r)} → делим на (x ${r < 0 ? '+' : '−'} ${fmt(Math.abs(r))})</div>`;
        k++;
      }
    }
    if (k === 0) {
      // численный поиск всех корней
      const found = numericRoots(rest, 3);
      html += `<div>Рациональных корней нет — находим численно</div>`;
      html += `<div class="answer">Ответ: x ≈ ${found.map(x => x.toFixed(3)).join(', ')}</div>`;
      show(html);
      drawFunction(null, [{a:a, b:b, c:c, d:d}], found, 3);
      return;
    }
    // осталась квадратичная или линейная
    if (rest.length === 3) { // ax² + bx + c после деления (rest = [q2, q1, q0]... но мы храним по-другому)
    }
    // rest хранится как массив коэффициентов, длина 4-k
    if (rest.length - 0 === 3) {}
    const m = rest.length; // 4 - k
    if (m === 3) {
      const A = rest[0], B = rest[1], C = rest[2];
      const D2 = B*B - 4*A*C;
      html += `<div>Осталось квадратное: ${fmt(A)}x² + ${fmt(B)}x + ${fmt(C)} = 0, D = ${fmt(D2)}</div>`;
      if (D2 > 0) {
        roots.push((-B + Math.sqrt(D2)) / (2*A), (-B - Math.sqrt(D2)) / (2*A));
      } else if (D2 === 0) {
        roots.push(-B / (2*A));
      } else {
        const re = -B/(2*A), im = Math.sqrt(-D2)/(2*A);
        html += `<div>Остальные корни комплексные: ${fmt(re)} ± ${fmt(Math.abs(im))}i</div>`;
      }
    } else if (m === 2) {
      roots.push(-rest[1] / rest[0]);
    }
    const uniq = [...new Set(roots.map(r => +r.toFixed(10)))];
    html += `<div class="answer">Ответ: x = ${uniq.map(fmt).join(', ')}</div>`;
    show(html);
    drawFunction(null, [{a:a, b:b, c:c, d:d}], uniq, 3);
  }

  function polyVal(coeffs, deg, x) {
    let s = 0;
    for (let i = 0; i < coeffs.length; i++) s = s * x + coeffs[i];
    return s;
  }

  // деление полинома на (x - r): coeffs от старшей степени
  function divideByRoot(coeffs, r) {
    const n = coeffs.length;
    const out = [coeffs[0]];
    for (let i = 1; i < n - 1; i++) out.push(coeffs[i] + out[i-1] * r);
    return out;
  }

  function numericRoots(coeffs, deg) {
    const f = x => polyVal(coeffs, deg, x);
    const found = [];
    const R = Math.max(50, Math.abs(coeffs[coeffs.length-1]) + 10);
    let prev = f(-R);
    for (let x = -R + 0.01; x <= R; x += 0.01) {
      const cur = f(x);
      if (prev * cur < 0 || Math.abs(cur) < 1e-9) {
        // уточняем бисекцией
        let lo = x - 0.01, hi = x;
        for (let i = 0; i < 60; i++) {
          const mid = (lo + hi) / 2;
          if (f(lo) * f(mid) <= 0) hi = mid; else lo = mid;
        }
        const root = +(((lo + hi) / 2).toFixed(8));
        if (!found.some(r => Math.abs(r - root) < 1e-4)) found.push(root);
      }
      prev = cur;
    }
    return found;
  }

  function solveSystem(a1, b1, c1, a2, b2, c2) {
    const det = a1 * b2 - a2 * b1;
    if (det === 0) {
      const same = (a1 * c2 === a2 * c1) && (b1 * c2 === b2 * c1);
      show(same
        ? '<div class="answer">Система имеет бесконечно много решений (прямые совпадают)</div>'
        : '<div class="answer">Система не имеет решений (прямые параллельны)</div>');
      // график прямых всё равно покажем
      drawSystem(a1, b1, c1, a2, b2, c2, null, null);
      return;
    }
    const x = (c1 * b2 - c2 * b1) / det;
    const y = (a1 * c2 - a2 * c1) / det;
    show(`<div><strong>Метод Крамера:</strong> Δ = a₁b₂ − a₂b₁ = ${fmt(a1*b2)} − ${fmt(a2*b1)} = <strong>${fmt(det)}</strong></div>
          <div>Δx = c₁b₂ − c₂b₁ = <strong>${fmt(c1*b2 - c2*b1)}</strong></div>
          <div>Δy = a₁c₂ − a₂c₁ = <strong>${fmt(a1*c2 - a2*c1)}</strong></div>
          <div>x = Δx / Δ, y = Δy / Δ</div>
          <div class="answer">x = ${fmt(x)}, y = ${fmt(y)}</div>`);
    drawSystem(a1, b1, c1, a2, b2, c2, x, y);
  }

  function solveLinearForChart(A, B) {
    // возвращает функцию y(x) для прямой Ax + By = C
    if (B !== 0) return x => (A * x - (-(-1))) , null;
  }

  // ---------- график ----------
  function drawFunction(_, polys, marks, deg) {
    // polys: массив коэффициентов от старшей степени
    chart.style.display = 'block';
    const W = chart.width, H = chart.height;
    ctx.clearRect(0, 0, W, H);

    // функция f(x)
    const f = x => polys.reduce((s, p) => {
      let v = 0;
      const n = p.a !== undefined ? Object.keys(p).length : 0;
      // собираем коэффициенты по степеням
      let cs = [];
      if (deg === 1) cs = [p.a, p.b];
      else if (deg === 2) cs = [p.a, p.b, p.c];
      else if (deg === 3) cs = [p.a, p.b, p.c, p.d];
      else if (deg === 4) cs = [p.a, p.b, p.c || 0, p.d || 0];
      for (let i = 0; i < cs.length; i++) v = v * x + cs[i];
      return s + v;
    }, 0);

    let span = 10, cxa = 0;
    if (marks.length) {
      const cxm = marks.reduce((s, m) => s + m, 0) / marks.length;
      span = Math.max(6, Math.abs(cxm) * 0.6 + 4);
      cxa = cxm;
    }

    const toX = x => W/2 + (x - cxa) * (W / span) / 2;
    let yMinVal = Infinity, yMaxVal = -Infinity;
    for (let i = 0; i <= 300; i++) {
      const x = cxa - span/2 + span * i / 300;
      const y = f(x);
      yMinVal = Math.min(yMinVal, y);
      yMaxVal = Math.max(yMaxVal, y);
    }
    yMinVal = Math.min(yMinVal, 0);
    yMaxVal = Math.max(yMaxVal, 0);
    let ySpan = yMaxVal - yMinVal || 1;
    // ограничиваем разброс, чтобы график не улетал
    if (ySpan > span * 3) { ySpan = span * 3; }
    const yMid = (yMinVal + yMaxVal) / 2;
    const toY = y => H/2 - Math.max(-ySpan/2, Math.min(ySpan/2, y - yMid)) * (H - 40) / ySpan;

    // сетка и оси
    ctx.strokeStyle = '#eeeafc';
    ctx.lineWidth = 1;
    for (let gx = 0; gx < W; gx += W/12) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    ctx.strokeStyle = '#c8c4e8';
    const y0 = toY(0), x0 = toX(0);
    if (y0 >= 0 && y0 <= H) { ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke(); }
    if (x0 >= 0 && x0 <= W) { ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, H); ctx.stroke(); }

    // кривая
    ctx.strokeStyle = '#667eea';
    ctx.lineWidth = 3;
    ctx.beginPath();
    let started = false;
    let prevY = null;
    for (let i = 0; i <= 300; i++) {
      const x = cxa - span/2 + span * i / 300;
      let y = f(x);
      if (!isFinite(y)) { started = false; prevY = null; continue; }
      // отсекаем вертикальные скачки (асимптоты)
      if (prevY !== null && Math.abs(y - prevY) > ySpan) { started = false; }
      const py = toY(y);
      if (py < -H || py > 2*H) { started = false; prevY = y; continue; }
      if (!started) { ctx.moveTo(toX(x), py); started = true; }
      else ctx.lineTo(toX(x), py);
      prevY = y;
    }
    ctx.stroke();

    // отмечаем корни
    ctx.fillStyle = '#e17055';
    marks.forEach(m => {
      ctx.beginPath();
      ctx.arc(toX(m), toY(0), 6, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawSystem(a1, b1, c1, a2, b2, c2, px, py) {
    chart.style.display = 'block';
    const W = chart.width, H = chart.height;
    ctx.clearRect(0, 0, W, H);

    // прямые в виде y = (C - Ax)/B
    const lines = [];
    [[a1, b1, c1], [a2, b2, c2]].forEach(([A, B, C]) => {
      if (B !== 0) lines.push({ f: x => (C - A * x) / B, color: '#667eea' });
      else lines.push({ vert: A !== 0 ? C / A : null, color: '#667eea' });
    });

    // определяем масштаб: центр — точка пересечения или 0
    const cx = px !== null ? px : 0;
    const cy = py !== null ? py : 0;
    const span = Math.max(8, Math.abs(cx) * 0.6 + 4, Math.abs(cy) * 0.6 + 4);
    const toX = x => W/2 + (x - cx) * (W / span) / 2;
    const toY = y => H/2 - (y - cy) * (H / span) / 2;

    // сетка и оси
    ctx.strokeStyle = '#eeeafc';
    for (let gx = 0; gx < W; gx += W/12) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
    ctx.strokeStyle = '#c8c4e8';
    const y0 = toY(0), x0 = toX(0);
    if (y0 >= 0 && y0 <= H) { ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke(); }
    if (x0 >= 0 && x0 <= W) { ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, H); ctx.stroke(); }

    lines.forEach(L => {
      ctx.strokeStyle = L.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (L.f) {
        ctx.moveTo(toX(cx - span/2), toY(L.f(cx - span/2)));
        ctx.lineTo(toX(cx + span/2), toY(L.f(cx + span/2)));
      } else if (L.vert !== null) {
        ctx.moveTo(toX(L.vert), 0);
        ctx.lineTo(toX(L.vert), H);
      }
      ctx.stroke();
    });

    // точка пересечения
    if (px !== null) {
      ctx.fillStyle = '#e17055';
      ctx.beginPath();
      ctx.arc(toX(px), toY(py), 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#333';
      ctx.font = '13px Segoe UI';
      ctx.fillText(`(${fmt(px)}; ${fmt(py)})`, toX(px) + 10, toY(py) - 10);
    }
  }
</script>
</body>
</html>
